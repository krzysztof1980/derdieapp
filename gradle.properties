# No org.gradle.java.home here on purpose: an absolute JDK path is machine-specific and
# must not be tracked. If this box needs the daemon pinned to JDK 17 (KGP <= 2.0.x chokes
# on Temurin 25 version strings; the Kotlin 2.4.21 in the catalog does not), set
# org.gradle.java.home in ~/.gradle/gradle.properties — host-local, see README
# Troubleshooting. CI pins its own JDK via setup-java and needs no pin.
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
# AGP 9 defaults to built-in Kotlin + new DSL, but the plan pins KGP/Compose at
# Kotlin 2.4.21 via the version catalog; these opt-outs keep the kotlin-android
# and org.jetbrains.kotlin.plugin.compose wiring (removed again in AGP 10).
android.builtInKotlin=false
android.newDsl=false
