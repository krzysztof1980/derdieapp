# The Kotlin daemon inherits the Gradle daemon JVM, and KGP 2.0.21's bundled
# JavaVersion parser rejects Temurin 25's "25.0.4.1" version string — run on 17
# (matches :core jvmToolchain(17)). JDK 25 stays available via toolchain resolution.
org.gradle.java.home=/home/krzysiek/.jdks/jdk-17.0.20.1+1
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
