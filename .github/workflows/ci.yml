name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Temurin 21 runs this repo's Gradle daemon (wrapper 9.7.1 runs fine on 21).
      # JDK 17 is installed alongside because :core and :app declare jvmToolchain(17);
      # Gradle auto-detects it. JDK 25 is here only for the parser staging step below —
      # the parser declares a 25 toolchain for its class files.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
            17
          cache: gradle

      # :exporter depends on wiktiopeggynary:1.0-SNAPSHOT, which lives in neither
      # Maven Central nor this repo — so CI builds it from source, exactly like the
      # README quick-start tells humans to. The parser resolves
      # wiktionary-dump-browser:1.0-SNAPSHOT the same way, one level deeper. Plain
      # clones to the runner temp dir keep both out of this repo's workspace; both
      # default branches are public.
      - name: Stage wiktiopeggynary:1.0-SNAPSHOT into mavenLocal
        run: |
          set -eo pipefail
          clone_and_publish() { # $1 repo, $2 dir
            git clone --depth 1 "https://github.com/krzysztof1980/$1.git" "$RUNNER_TEMP/$2"
            (cd "$RUNNER_TEMP/$2" && chmod +x gradlew && JAVA_HOME="$JAVA_HOME_25_X64" ./gradlew --no-daemon -q publishToMavenLocal)
          }
          clone_and_publish wiktionary-dump-browser dump-browser
          clone_and_publish wiktio-peggy-nary wiktio-peggy-nary

      # No setup-android here: ubuntu-latest ships the Android SDK with licenses accepted
      # (android-actions/setup-android@v3 itself fails on current images). If AGP ever
      # needs a platform/build-tools piece the image lacks, its auto-download is licensed
      # by the sdkmanager licenses dir already present; local.properties stays gitignored
      # and AGP falls back to ANDROID_HOME.
      - name: Tests + debug assemble
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./gradlew :core:test :exporter:test :app:testDebugUnitTest :app:assembleDebug
