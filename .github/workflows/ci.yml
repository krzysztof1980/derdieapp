name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Temurin 21 runs the Gradle daemon (wrapper 9.7.1 runs fine on 21). JDK 17 is
      # installed alongside because :core and :app declare jvmToolchain(17); Gradle
      # auto-detects it. Nothing here needs JDK 25 — :exporter (the only JDK 25 module)
      # is deliberately not built, see the note on the build step.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17
          cache: gradle

      # The SDK is preinstalled on ubuntu-latest runners; this action is here to accept
      # licenses deterministically so AGP may auto-download whatever platform/build-tools
      # 35 piece is missing. local.properties is gitignored; AGP falls back to ANDROID_HOME.
      - uses: android-actions/setup-android@v3

      - name: Tests + debug assemble
        # :exporter:test is deliberately absent: it resolves
        # wiktiopeggynary:1.0-SNAPSHOT from mavenLocal, which lives only in the private
        # companion repo. Including it would not merely red the exporter job — without
        # --continue, Gradle aborts the whole run as soon as that dependency resolution
        # fails, so :core/:app results would never be produced either. Re-add
        # :exporter:test here once the snapshot is staged on the runner or published to a
        # fetchable repository (README "CI" tracks this TODO).
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug
